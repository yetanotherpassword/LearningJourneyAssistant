# LJA subject catalogue (IOLG-113).
#
# The single source that both test-data paths are generated from:
#   python -m lja.data.catalogue_generator ../data-fixtures/subject_catalogue.yaml --students 500 --out ...
# writes the Excel workbook (Assessment Map / Results / Student Summary) for
# python/lja, and with --moodle-out also the competency-framework CSVs, the
# criterion-to-SILO map and the rubric marking fixture for devenv Moodle.
#
# Three subjects are `source: supplied` -- CSE1OOF, CSE2ALG, CSE3CAP -- and
# their SILO texts, assessment names, weights, contributions and SILO orders
# are copied VERBATIM from data-fixtures/CSE_results_150_students_3_Subjects.xlsx.
# python/tests/test_catalogue.py checks that equality against the workbook,
# so editing them here fails a test rather than silently diverging.
#
# Every other subject is `source: synthetic`: the codes reuse the shortnames
# devenv/seed.sh already generates, but the titles, SILOs and assessments are
# invented for testing and are NOT La Trobe handbook entries. Add more by hand
# or with python -m lja.data.catalogue_draft.
#
# `competency` on each SILO is the catalogue's ground truth for which
# cross-subject competency that SILO evidences. It drives the generator's
# per-student ability model and is what catalogue_verify.py scores the LLM's
# clustering against. It is an authoring judgement, not a fact about the
# degree -- disagree with a tag by changing it.
version: 1
title: LJA synthetic subject catalogue

rubric_levels:
  0: Not demonstrated
  1: Developing
  2: Proficient
  3: Exemplary

competencies:
  - id: oo-modelling
    label: Object-oriented analysis and modelling
    description: Analysing a problem and modelling it as objects that combine data and behaviour, expressed in OO design notation.
  - id: abstraction-encapsulation
    label: Abstraction and encapsulation
    description: Using abstract data types, interfaces and encapsulation to localise and minimise change.
  - id: code-reuse
    label: Code quality, reuse and modular design
    description: Organising code for readability, reuse and maintainability.
  - id: software-construction
    label: Building working software for real problems
    description: Designing, implementing and evaluating complete software solutions to realistic problems.
  - id: data-structures-algorithms
    label: Data structures and algorithms
    description: Identifying, implementing and comparing data structures and searching and sorting algorithms.
  - id: project-management
    label: Project management
    description: Planning, tracking and managing software project work.
  - id: communication
    label: Communicating to technical and non-technical audiences
    description: Presenting and reporting outcomes to mixed audiences and responding to feedback.
  - id: technical-documentation
    label: Technical documentation and reporting
    description: Producing professional system documentation and technical reports to industry standards.
  - id: programming-fundamentals
    label: Programming fundamentals
    description: Decomposing problems and writing, tracing and debugging programs in a procedural style.
  - id: testing-quality
    label: Testing and software quality
    description: Verifying software through unit, integration and acceptance testing and defensive practice.
  - id: data-modelling
    label: Data modelling and databases
    description: Modelling data requirements, designing relational schemas and querying them.
  - id: web-systems
    label: Web, cloud and distributed systems
    description: Building, deploying and operating web-based and distributed applications.
  - id: security
    label: Security
    description: Identifying threats and applying countermeasures in software and networks.
  - id: systems-networks
    label: Operating systems, environments and networks
    description: Working with command-line environments, operating system concepts and network architecture.
  - id: professional-practice
    label: Teamwork, ethics and professional practice
    description: Working effectively and ethically in a team using industry practices.
  - id: requirements-analysis
    label: Requirements elicitation and analysis
    description: Eliciting, analysing and specifying what a system must do.

