# Conda environment for the Learning Journey Assistant extraction layer.
#   conda env create -f environment.yml
#   conda activate lja
name: lja
channels:
  - conda-forge
dependencies:
  - python=3.12
  - requests
  - pandas
  - openpyxl
  - psycopg2
  - python-dotenv
  - pydantic
  - pytest
  - fastapi
  - uvicorn
  - jinja2
  - pip
  - pip:
      - types-requests
      - anthropic
      - openai
