# Conda environment for the Learning Journey Assistant extraction layer.
#   conda env create -f environment.yml
#   conda activate lja
name: lja
channels:
  - conda-forge
dependencies:
  - python=3.12
  - requests
  - pandas
  - openpyxl
  - psycopg2
  # For the export layer's sample notebook (docs/export-sample.ipynb, tender
  # req 7): matplotlib renders its bar chart, jupyter opens and runs it.
  - matplotlib
  - jupyter
  - python-dotenv
  - pydantic
  - pytest
  - fastapi
  - uvicorn
  - jinja2
  - pip
  - pip:
      - types-requests
      - anthropic
      - openai
